spring.application.name=smartHospitalAvailabilitySystem

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_hospital?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:new_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=2s
